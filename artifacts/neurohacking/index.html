    <style>
      html, body {
        background: #0F2035;
      }
      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse 80% 48% at 50% -4%, rgba(37, 99, 235, .28), transparent 68%),
          #0F2035;
        color: #f6f3ed;
        opacity: 1;
        transition: opacity .2s ease;
        min-height: 100vh;
        min-height: 100svh;
      }
      #app-boot-loader.is-ready {
        opacity: 0;
        pointer-events: none;
      }
      .app-boot-loader__content {
        display: flex;
        width: min(320px, calc(100vw - 48px));
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform: translateY(-2vh);
      }
      .app-boot-loader__logo-wrap {
        position: relative;
        display: grid;
        width: 174px;
        height: 174px;
        place-items: center;
        margin-bottom: 28px;
      }
      .app-boot-loader__logo-wrap::before,
      .app-boot-loader__logo-wrap::after {
        position: absolute;
        content: "";
        border: 1px solid rgba(249, 115, 22, .18);
        border-radius: 50%;
        animation: app-boot-orbit 10s linear infinite;
      }
      .app-boot-loader__logo-wrap::before {
        width: 143px;
        height: 143px;
        border-color: rgba(255, 214, 126, .34);
      }
      .app-boot-loader__logo-wrap::after {
        width: 170px;
        height: 170px;
        border-style: dashed;
        animation-direction: reverse;
        animation-duration: 14s;
      }
      .app-boot-loader__logo {
        position: relative;
        z-index: 1;
        width: 132px;
        height: 132px;
        object-fit: contain;
        animation: app-boot-pulse 2.4s ease-in-out infinite;
        filter: saturate(1.08) brightness(1.05) drop-shadow(0 0 8px rgba(249, 115, 22, .55));
      }
      .app-boot-loader__label {
        margin: 0;
        font: 600 17px/1.4 "IBM Plex Sans", sans-serif;
        letter-spacing: .015em;
      }
      .app-boot-loader__dots {
        display: flex;
        gap: 6px;
        margin-top: 16px;
      }
      .app-boot-loader__dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fdba74;
        animation: app-boot-dot .9s ease-in-out infinite;
      }
      .app-boot-loader__dots span:nth-child(2) { animation-delay: .16s; }
      .app-boot-loader__dots span:nth-child(3) { animation-delay: .32s; }
      .app-boot-loader__bar {
        width: 144px;
        height: 4px;
        margin-top: 20px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, .08);
      }
      .app-boot-loader__bar::after {
        display: block;
        width: 50%;
        height: 100%;
        content: "";
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #F97316, #FFE2A1, transparent);
        animation: app-boot-bar 1.7s ease-in-out infinite;
      }
      @keyframes app-boot-pulse {
        0%, 100% { transform: scale(.96); opacity: .88; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes app-boot-orbit {
        to { transform: rotate(360deg); }
      }
      @keyframes app-boot-dot {
        0%, 100% { transform: translateY(0); opacity: .28; }
        50% { transform: translateY(-5px); opacity: 1; }
      }
      @keyframes app-boot-bar {
        from { transform: translateX(-200%); }
        to { transform: translateX(300%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot-loader * { animation: none !important; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- OneSignal v16 SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        if (window.location.hostname !== "neyrohaking.vercel.app") {
          return;
        }

        await OneSignal.init({
          appId: "122e7ca3-56bf-459a-8bd6-768820630bb7",
          notifyButton: { enable: false },
          allowLocalhostAsSecureOrigin: true,
          serviceWorkerParam: { scope: "/" },
        });
      });
    </script>
  </head>
  <body>
    <div id="app-boot-loader" role="status" aria-live="polite">
      <div class="app-boot-loader__content">
        <div class="app-boot-loader__logo-wrap">
          <img
            class="app-boot-loader__logo"
            src="/memory-logo.png?v=5"
            alt=""
            decoding="sync"
            fetchpriority="high"
          />
        </div>
        <p class="app-boot-loader__label">Загружаем твои данные…</p>
        <div class="app-boot-loader__dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="app-boot-loader__bar" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
